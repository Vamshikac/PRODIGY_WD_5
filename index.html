<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Weather App</h1>

    <form class="search" id="searchForm">
      <input id="cityInput" type="text" placeholder="Search a city, e.g. Bengaluru"
             aria-label="City name" autocomplete="off" />
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <div class="toolbar">
      <button type="button" class="secondary" id="locBtn">Use my location</button>
      <button type="button" class="secondary" id="unitBtn" aria-label="Switch temperature unit">Switch to °F</button>
    </div>

    <p class="message" id="message" role="status"></p>

    <section class="current hidden" id="current" aria-live="polite">
      <div class="place" id="place"></div>
      <div class="main">
        <div class="icon" id="icon"></div>
        <div>
          <div class="temp" id="temp"></div>
          <div class="desc" id="desc"></div>
        </div>
      </div>
      <div class="details">
        <div class="detail"><span>Feels like</span><strong id="feels"></strong></div>
        <div class="detail"><span>Humidity</span><strong id="humidity"></strong></div>
        <div class="detail"><span>Wind</span><strong id="wind"></strong></div>
        <div class="detail"><span>Pressure</span><strong id="pressure"></strong></div>
      </div>
    </section>

    <section class="forecast hidden" id="forecast" aria-label="5 day forecast"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
